name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout production files
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare site artifact
        run: |
          rm -rf _site
          mkdir _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            ./ _site/
          touch _site/.nojekyll

      - name: Check latest WoW Forever build
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          product = "wow_classic_beta"
          url = f"https://wago.tools/api/builds/{product}/latest"
          checked_at = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
          out_path = "_site/data/latest-build.json"
          os.makedirs(os.path.dirname(out_path), exist_ok=True)

          result = {
              "ok": False,
              "product": product,
              "checkedAt": checked_at
          }

          try:
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "wow-builder-pages/1.0"}
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  raw = response.read().decode("utf-8").strip()

              try:
                  payload = json.loads(raw)
              except json.JSONDecodeError:
                  payload = raw

              latest = None
              if isinstance(payload, str):
                  latest = payload
              elif isinstance(payload, dict):
                  for key in ("version", "build", "latest"):
                      value = payload.get(key)
                      if isinstance(value, str):
                          latest = value
                          break

              if not latest:
                  raise ValueError(f"Unexpected Wago response: {raw[:200]}")

              result["ok"] = True
              result["latestBuild"] = latest

              current = None
              manifest_path = "_site/data/build.json"
              if os.path.exists(manifest_path):
                  with open(manifest_path, "r", encoding="utf-8") as fh:
                      current = json.load(fh).get("build")

              print(f"Production build: {current or 'unknown'}")
              print(f"Latest Wago build: {latest}")
              print("Freshness:", "current" if current == latest else "outdated")

          except Exception as exc:
              result["error"] = str(exc)
              print(f"Wago latest-build check failed: {exc}")

          with open(out_path, "w", encoding="utf-8") as fh:
              json.dump(result, fh, ensure_ascii=False, indent=2)
              fh.write("\n")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
